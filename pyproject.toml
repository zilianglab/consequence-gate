[project]
name = "consequence-gate"
version = "0.1.0"
description = "A governance layer that decides whether an agent's tool call is allowed to execute, based on what being wrong would cost."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consequence_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
